plugins {
    id 'com.android.application'
}

// App Key do DJI Developer Center. Defina em android/local.properties:
//   DJI_APP_KEY=xxxxxxxxxxxxxxxxxxxxxxxx
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}
def djiAppKey = localProps.getProperty('DJI_APP_KEY', '')

// Envio para o Firebase (nuvem) é opcional: só ativa se você colocar o arquivo
// google-services.json (baixado do Firebase Console) nesta pasta (android/app/). Veja
// firebase/README.md. Sem o arquivo, o app compila normalmente e o switch de nuvem
// mostra "Firebase não configurado".
def hasGoogleServices = file('google-services.json').exists()
if (hasGoogleServices) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.dji.mavictelemetry'
    // AGP 8.13.2 (veja android/build.gradle) e o Firebase BoM exigem compileSdk mais novo;
    // precisa da plataforma "Android 14 (API 34)" instalada no SDK Manager do Android Studio.
    compileSdkVersion 34

    defaultConfig {
        // Deve ser IDÊNTICO ao package name cadastrado no App Key.
        applicationId "com.dji.mavictelemetry"
        // O SDK do Firebase exige minSdkVersion >= 23 (o merge do AndroidManifest falha com 21;
        // veja firebase/README.md). Isso deixa de fora só Android 5.0/5.1 (Lollipop).
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        manifestPlaceholders = [DJI_APP_KEY: djiAppKey]
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        doNotStrip "*/*/libdjivideo.so"
        doNotStrip "*/*/libSDKRelativeJNI.so"
        doNotStrip "*/*/libFlyForbid.so"
        doNotStrip "*/*/libduml_vision_bokeh.so"
        doNotStrip "*/*/libyuv2.so"
        doNotStrip "*/*/libGroudStation.so"
        doNotStrip "*/*/libFRCorkscrew.so"
        doNotStrip "*/*/libUpgradeVerify.so"
        doNotStrip "*/*/libFR.so"
        resources {
            excludes += ['META-INF/rxjava.properties']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'

    // DJI Mobile SDK V4 (suporta Mavic Pro)
    implementation('com.dji:dji-sdk:4.16.4', {
        exclude module: 'library-anti-distortion'
        exclude module: 'fly-safe-database'
    })
    compileOnly 'com.dji:dji-sdk-provided:4.16.4'

    // Firebase (nuvem). O BoM fixa versões compatíveis entre si.
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-auth'
}
